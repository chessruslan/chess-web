name: my_new_chess_app
description: Chess demo project
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- базовые пакеты проекта ---
  chess: ^0.8.1
  flutter_svg: ^2.0.10+1
  audioplayers: ^6.5.1

  # --- видеосвязь и сигналы ---
  flutter_webrtc: ^1.2.0
  permission_handler: ^12.0.1
  uuid: ^4.4.0

  # --- Supabase (БД, аутентификация, realtime) ---
  supabase_flutter: ^2.5.7

  # --- HTTP-запросы ---
  http: ^1.2.2

  # --- 🔹 ДОБАВЛЕНО: выбор файлов (для фоновой картинки) ---
  file_picker: ^8.1.7

  # --- 🔹 ДОБАВЛЕНО: сохранение пути к фону между перезапусками ---
  shared_preferences: ^2.3.2

  # --- Desktop/offline/update ---
  path_provider: ^2.1.5
  package_info_plus: ^8.1.1
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8

  # --- 🔹 ДОБАВЛЕНО: выбор цвета для темы доски ---
  flutter_colorpicker: ^1.1.0

  win32: 5.15.0
  url_launcher: ^6.3.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pieces/cburnett/
    - assets/sfx/